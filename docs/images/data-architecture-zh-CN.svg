<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1110" viewBox="0 0 1800 1110" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">从历史数据找到下一个 Alpha</title><desc id="desc">历史证据帮助识别策略钱包；钱包的新活动提出下一轮需要验证的问题。</desc><defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#2563b8"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#7953ad"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#a8661e"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#20775b"/></marker>
</defs><style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#24384d; }
.title { font-size:38px; font-weight:700; letter-spacing:-.4px; }
.heading { font-size:23px; font-weight:650; }
.node { font-size:21px; font-weight:600; }
.body { font-size:18px; fill:#526579; }
.small { font-size:16px; fill:#61758a; }
.code { font-family:'SFMono-Regular',Consolas,monospace; font-size:16px; }
.label { font-size:14px; font-weight:650; letter-spacing:1px; fill:#61758a; }
</style>
<rect x="0" y="0" width="1800" height="1110" rx="0" fill="#ffffff" stroke="none" stroke-width="1.3"/>
<text x="40" y="40" class="label" text-anchor="start">PROTOCOL ALPHA FINDER  /  EVIDENCE CYCLE</text>
<text x="40" y="94" class="title" text-anchor="start">从历史数据找到下一个 Alpha</text>
<text x="40" y="134" class="body" text-anchor="start">历史证据帮助识别策略钱包；钱包的新活动提出下一轮需要验证的问题。</text>
<path data-kind="history-analysis" d="M 560 390 C 599.0 390 599.0 390 638 390" stroke="#2563b8" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a0)"/>
<path data-kind="analysis-wallet" d="M 1160 390 C 1199.0 390 1199.0 390 1238 390" stroke="#2563b8" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a0)"/>
<path data-kind="monitor-candidate" d="M 1238 823 C 1200.0 823 1200.0 823 1162 823" stroke="#7953ad" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a1)"/>
<path data-kind="candidate-validation" d="M 638 823 C 600.0 823 600.0 823 562 823" stroke="#a8661e" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a2)"/>
<path data-kind="wallet-monitor" d="M 1500 555 C 1500 591.0 1500 591.0 1500 627" stroke="#2563b8" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a0)"/>
<rect x="40" y="195" width="520" height="360" rx="18" fill="#ffffff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="40" y="195" width="520" height="78" rx="18" fill="#eff5ff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="62" y="215" width="38" height="38" rx="19" fill="#2563b8" stroke="#2563b8" stroke-width="1.3"/>
<text x="81" y="242" class="node" text-anchor="middle" style="fill:#ffffff">1</text>
<text x="116" y="243" class="heading" text-anchor="start">读取历史证据</text>
<text x="64" y="307" class="node" text-anchor="start">合约调用</text>
<text x="64" y="332" class="body" text-anchor="start">钱包调用了哪些合约与函数？</text>
<text x="64" y="362" class="node" text-anchor="start">交易回执与事件日志</text>
<text x="64" y="387" class="body" text-anchor="start">这些操作是否真正执行成功？</text>
<text x="64" y="417" class="node" text-anchor="start">代币流动与费用</text>
<text x="64" y="442" class="body" text-anchor="start">哪些资产流入、流出，最终剩余多少？</text>
<text x="64" y="472" class="node" text-anchor="start">协议状态</text>
<text x="64" y="497" class="body" text-anchor="start">什么条件让这次操作成为可能？</text>
<path d="M 64 511 L 536 511" stroke="#e8eef4" fill="none"/>
<text x="64" y="537" class="label" text-anchor="start" style="fill:#2563b8">输入：链上历史数据</text>
<rect x="640" y="195" width="520" height="360" rx="18" fill="#ffffff" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="640" y="195" width="520" height="78" rx="18" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="662" y="215" width="38" height="38" rx="19" fill="#7953ad" stroke="#7953ad" stroke-width="1.3"/>
<text x="681" y="242" class="node" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="716" y="243" class="heading" text-anchor="start">识别重复行为</text>
<text x="664" y="307" class="node" text-anchor="start">匹配已知 Seed 操作</text>
<text x="664" y="332" class="body" text-anchor="start">从成功调用中找到真实执行者。</text>
<text x="664" y="378" class="node" text-anchor="start">还原执行过程</text>
<text x="664" y="403" class="body" text-anchor="start">串联合约调用、资产流动与执行成本。</text>
<text x="664" y="449" class="node" text-anchor="start">对比多次执行</text>
<text x="664" y="474" class="body" text-anchor="start">区分重复行为与偶发操作。</text>
<path d="M 664 511 L 1136 511" stroke="#e8eef4" fill="none"/>
<text x="664" y="537" class="label" text-anchor="start" style="fill:#7953ad">分析：操作序列与资产流</text>
<rect x="1240" y="195" width="520" height="360" rx="18" fill="#ffffff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="1240" y="195" width="520" height="78" rx="18" fill="#eff5ff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="1262" y="215" width="38" height="38" rx="19" fill="#2563b8" stroke="#2563b8" stroke-width="1.3"/>
<text x="1281" y="242" class="node" text-anchor="middle" style="fill:#ffffff">3</text>
<text x="1316" y="243" class="heading" text-anchor="start">找到策略钱包</text>
<text x="1264" y="307" class="node" text-anchor="start">保留真实执行者</text>
<text x="1264" y="332" class="body" text-anchor="start">区分钱包、中继者与辅助合约。</text>
<text x="1264" y="378" class="node" text-anchor="start">附上可追溯的证据</text>
<text x="1264" y="403" class="body" text-anchor="start">记录入口、调用、回执及执行角色。</text>
<text x="1264" y="449" class="node" text-anchor="start">形成待研究的钱包名单</text>
<text x="1264" y="474" class="body" text-anchor="start">继续研究钱包在原始 Seed 之外的活动。</text>
<path d="M 1264 511 L 1736 511" stroke="#e8eef4" fill="none"/>
<text x="1264" y="537" class="label" text-anchor="start" style="fill:#2563b8">产出：有执行证据的钱包</text>
<rect x="1240" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="1240" y="635" width="520" height="78" rx="18" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="1262" y="655" width="38" height="38" rx="19" fill="#7953ad" stroke="#7953ad" stroke-width="1.3"/>
<text x="1281" y="682" class="node" text-anchor="middle" style="fill:#ffffff">4</text>
<text x="1316" y="683" class="heading" text-anchor="start">观察新增活动</text>
<text x="1264" y="747" class="node" text-anchor="start">读取新增交易</text>
<text x="1264" y="772" class="body" text-anchor="start">寻找新合约与新的调用序列。</text>
<text x="1264" y="818" class="node" text-anchor="start">与已有钱包历史对比</text>
<text x="1264" y="843" class="body" text-anchor="start">识别行为变化和重复发生的操作。</text>
<text x="1264" y="889" class="node" text-anchor="start">重新检查协议条件</text>
<text x="1264" y="914" class="body" text-anchor="start">观察先前的机会是否再次出现。</text>
<path d="M 1264 951 L 1736 951" stroke="#e8eef4" fill="none"/>
<text x="1264" y="977" class="label" text-anchor="start" style="fill:#7953ad">监控：新增活动与协议状态</text>
<rect x="640" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#f1dcc2" stroke-width="1.3"/>
<rect x="640" y="635" width="520" height="78" rx="18" fill="#fff7ed" stroke="#f1dcc2" stroke-width="1.3"/>
<rect x="662" y="655" width="38" height="38" rx="19" fill="#a8661e" stroke="#a8661e" stroke-width="1.3"/>
<text x="681" y="682" class="node" text-anchor="middle" style="fill:#ffffff">5</text>
<text x="716" y="683" class="heading" text-anchor="start">形成新的 Alpha 候选</text>
<text x="664" y="747" class="node" text-anchor="start">描述可能成立的机制</text>
<text x="664" y="772" class="body" text-anchor="start">解释这些操作如何产生收益。</text>
<text x="664" y="818" class="node" text-anchor="start">保留支持这一判断的执行记录</text>
<text x="664" y="843" class="body" text-anchor="start">附交易证据与成本估计。</text>
<text x="664" y="889" class="node" text-anchor="start">写出可以检验的假设</text>
<text x="664" y="914" class="body" text-anchor="start">说明什么证据能够支持或推翻它。</text>
<path d="M 664 951 L 1136 951" stroke="#e8eef4" fill="none"/>
<text x="664" y="977" class="label" text-anchor="start" style="fill:#a8661e">产出：候选假设与支持证据</text>
<rect x="40" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#c9e5d9" stroke-width="1.3"/>
<rect x="40" y="635" width="520" height="78" rx="18" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<rect x="62" y="655" width="38" height="38" rx="19" fill="#20775b" stroke="#20775b" stroke-width="1.3"/>
<text x="81" y="682" class="node" text-anchor="middle" style="fill:#ffffff">6</text>
<text x="116" y="683" class="heading" text-anchor="start">验证并继续研究</text>
<text x="64" y="747" class="node" text-anchor="start">检查证据、成本和当前状态</text>
<text x="64" y="772" class="body" text-anchor="start">判断观察到的行为是否构成实际优势。</text>
<text x="64" y="818" class="node" text-anchor="start">为每个候选生成报告</text>
<text x="64" y="843" class="body" text-anchor="start">可执行 · 持续观察 · 已排除 · 证据不足</text>
<text x="64" y="889" class="node" text-anchor="start">验证支持后再扩展</text>
<text x="64" y="914" class="body" text-anchor="start">已确认的机制可以成为新的 Seed。</text>
<path d="M 64 951 L 536 951" stroke="#e8eef4" fill="none"/>
<text x="64" y="977" class="label" text-anchor="start" style="fill:#20775b">产出：报告与后续检查</text>
<path data-kind="validated-seed-loop" d="M 300 633 C 300 598.0 300 598.0 300 563" stroke="#20775b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a3)" stroke-dasharray="5 6"/>
<text x="340" y="597" class="small" text-anchor="start" style="fill:#20775b">将已确认的机制作为新 Seed，结合新增证据继续下一轮研究。</text>
<text x="40" y="1090" class="small" text-anchor="start">这里的监控指重复采集与复查；当前工作流通过手动运行完成这些检查。</text>
</svg>
