<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1130" viewBox="0 0 1800 1130" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">从历史证据找到新的 Alpha</title><desc id="desc">先找到已知机制的真实执行者，再从他们的新操作中寻找其他机制。</desc><defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#2563b8"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#7953ad"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#a8661e"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#20775b"/></marker>
</defs><style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#24384d; }
.title { font-size:38px; font-weight:700; letter-spacing:-.4px; }
.heading { font-size:23px; font-weight:650; }
.node { font-size:21px; font-weight:600; }
.body { font-size:18px; fill:#526579; }
.small { font-size:16px; fill:#61758a; }
.code { font-family:'SFMono-Regular',Consolas,monospace; font-size:16px; }
.label { font-size:14px; font-weight:650; letter-spacing:1px; fill:#61758a; }
</style>
<rect x="0" y="0" width="1800" height="1130" rx="0" fill="#ffffff" stroke="none" stroke-width="1.3"/>
<defs>
<marker id="evidence-head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#657e94" stroke-width="1.7"/></marker>
<marker id="feedback-head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#769789" stroke-width="1.7"/></marker>
</defs>
<text x="40" y="58" class="title" text-anchor="start">从历史证据找到新的 Alpha</text>
<text x="40" y="99" class="body" text-anchor="start">先找到已知机制的真实执行者，再从他们的新操作中寻找其他机制。</text>
<rect x="40" y="145" width="1720" height="205" rx="8" fill="#f8fafc" stroke="#c8d3df" stroke-width="1.3"/>
<text x="65" y="184" class="heading" text-anchor="start">历史证据</text>
<rect x="65" y="214" width="365" height="107" rx="8" fill="#ffffff" stroke="#cbd6e1" stroke-width="1.3"/>
<text x="247.5" y="256" class="node" text-anchor="middle">合约调用</text>
<text x="247.5" y="290" class="body" text-anchor="middle">调用函数与执行顺序</text>
<rect x="500" y="214" width="365" height="107" rx="8" fill="#ffffff" stroke="#cbd6e1" stroke-width="1.3"/>
<text x="682.5" y="256" class="node" text-anchor="middle">交易回执与事件日志</text>
<text x="682.5" y="290" class="body" text-anchor="middle">成功执行的操作与真实执行者</text>
<rect x="935" y="214" width="365" height="107" rx="8" fill="#ffffff" stroke="#cbd6e1" stroke-width="1.3"/>
<text x="1117.5" y="256" class="node" text-anchor="middle">资产流动</text>
<text x="1117.5" y="290" class="body" text-anchor="middle">代币转移与执行费用</text>
<rect x="1370" y="214" width="365" height="107" rx="8" fill="#ffffff" stroke="#cbd6e1" stroke-width="1.3"/>
<text x="1552.5" y="256" class="node" text-anchor="middle">协议状态</text>
<text x="1552.5" y="290" class="body" text-anchor="middle">操作发生时的协议条件</text>
<path data-kind="historical-evidence-input" d="M 900 351 L 900 430" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<text x="925" y="397" class="body" text-anchor="start">交易证据与执行背景</text>
<rect x="40" y="440" width="1720" height="340" rx="8" fill="#f8fbfa" stroke="#bdcfc5" stroke-width="1.3"/>
<text x="65" y="484" class="heading" text-anchor="start">研究流程</text>
<text x="1735" y="484" class="body" text-anchor="end">对每个钱包重复研究</text>
<rect x="65" y="525" width="365" height="205" rx="8" fill="#ffffff" stroke="#c9d5dd" stroke-width="1.3"/>
<text x="86" y="564" class="small" text-anchor="start" style="fill:#6b8797">01</text>
<text x="128" y="564" class="node" text-anchor="start">分析历史执行</text>
<path d="M 85 586 L 410 586" stroke="#e1e8eb" fill="none"/>
<text x="247.5" y="622" class="body" text-anchor="middle">匹配已知 Seed 的操作</text>
<text x="247.5" y="656" class="body" text-anchor="middle">还原调用过程与资产流动</text>
<text x="247.5" y="690" class="body" text-anchor="middle">比较重复发生的执行记录</text>
<rect x="500" y="525" width="365" height="205" rx="8" fill="#ffffff" stroke="#c9d5dd" stroke-width="1.3"/>
<text x="521" y="564" class="small" text-anchor="start" style="fill:#6b8797">02</text>
<text x="563" y="564" class="node" text-anchor="start">策略钱包</text>
<path d="M 520 586 L 845 586" stroke="#e1e8eb" fill="none"/>
<text x="682.5" y="622" class="body" text-anchor="middle">识别真正执行操作的钱包</text>
<text x="682.5" y="656" class="body" text-anchor="middle">保留 Seed 与对应交易证据</text>
<text x="682.5" y="690" class="body" text-anchor="middle">研究原始 Seed 之外的行为</text>
<rect x="935" y="525" width="365" height="205" rx="8" fill="#ffffff" stroke="#c9d5dd" stroke-width="1.3"/>
<text x="956" y="564" class="small" text-anchor="start" style="fill:#6b8797">03</text>
<text x="998" y="564" class="node" text-anchor="start">观察新增活动</text>
<path d="M 955 586 L 1280 586" stroke="#e1e8eb" fill="none"/>
<text x="1117.5" y="622" class="body" text-anchor="middle">读取新合约与新调用记录</text>
<text x="1117.5" y="656" class="body" text-anchor="middle">与钱包已有历史行为对比</text>
<text x="1117.5" y="690" class="body" text-anchor="middle">重新检查协议的当前条件</text>
<rect x="1370" y="525" width="365" height="205" rx="8" fill="#ffffff" stroke="#c9d5dd" stroke-width="1.3"/>
<text x="1391" y="564" class="small" text-anchor="start" style="fill:#6b8797">04</text>
<text x="1433" y="564" class="node" text-anchor="start">Alpha 候选</text>
<path d="M 1390 586 L 1715 586" stroke="#e1e8eb" fill="none"/>
<text x="1552.5" y="622" class="body" text-anchor="middle">说明可能成立的收益机制</text>
<text x="1552.5" y="656" class="body" text-anchor="middle">附上执行记录与成本估计</text>
<text x="1552.5" y="690" class="body" text-anchor="middle">写出检验这一判断的方法</text>
<path data-kind="evidence-flow" d="M 440 628 L 490 628" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<path data-kind="evidence-flow" d="M 875 628 L 925 628" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<path data-kind="evidence-flow" d="M 1310 628 L 1360 628" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<path data-kind="candidate-validation" d="M 1552.5 731 L 1552.5 860" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<rect x="990" y="870" width="770" height="148" rx="8" fill="#f1f7f3" stroke="#afc8b8" stroke-width="1.3"/>
<text x="1014" y="911" class="node" text-anchor="start">检验交易证据、执行成本与当前协议条件</text>
<rect x="1014" y="937" width="332" height="55" rx="8" fill="#ffffff" stroke="#cad9d0" stroke-width="1.3"/>
<rect x="1364" y="937" width="372" height="55" rx="8" fill="#e6f1e9" stroke="#bad1c2" stroke-width="1.3"/>
<text x="1180" y="971" class="body" text-anchor="middle">每个候选都有一份报告</text>
<text x="1550" y="971" class="body" text-anchor="middle" style="fill:#38654f">验证支持后形成新的 Alpha</text>
<path data-kind="established-mechanism-return" d="M 980 944 H 813 Q 800 944 800 931 V 828 Q 800 815 787 815 H 260 Q 247.5 815 247.5 802 V 740" fill="none" stroke="#769789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#feedback-head)" stroke-dasharray="7 6"/>
<text x="490" y="802" class="small" text-anchor="middle" style="fill:#5d7d6e">已确认的机制 → 新的 Seed</text>
<path data-kind="evidence-flow" d="M 40 1060 H 100" fill="none" stroke="#657e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evidence-head)"/>
<text x="117" y="1066" class="small" text-anchor="start">证据与研究结果的流向</text>
<path data-kind="legend-feedback" d="M 495 1060 H 555" fill="none" stroke="#769789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#feedback-head)" stroke-dasharray="7 6"/>
<text x="572" y="1066" class="small" text-anchor="start">满足条件后继续下一轮研究</text>
<text x="40" y="1103" class="small" text-anchor="start">观察指重复采集与复查钱包活动；当前工作流由手动启动这些检查。</text>
</svg>
