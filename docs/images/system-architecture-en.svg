<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Protocol Alpha Finder · System Architecture</title>
<desc id="desc">TRON evidence feeds a host Agent. One orchestration Skill coordinates wallet discovery, investigation and validation. Saved research reaches the workspace through a local Python API.</desc>
