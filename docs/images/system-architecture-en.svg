<text x="1320" y="770" class="sub" text-anchor="start">Redeeming collateral for swaps</text>
<text x="1320" y="795" class="sub" text-anchor="start">may recycle capital faster</text>
<text x="1320" y="820" class="sub" text-anchor="start">after a liquidation.</text>
