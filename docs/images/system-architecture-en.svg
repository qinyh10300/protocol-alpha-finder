<text x="900" y="792" class="body" text-anchor="middle">We trace each wallet’s history to uncover repeated</text>
<text x="900" y="819" class="body" text-anchor="middle">actions and propose new mechanisms.</text>
<text x="900" y="851" class="small" text-anchor="middle" style="fill:#7953ad">wallet-alpha-investigation</text>
