<text x="150" y="413" class="node" text-anchor="middle">JustLend</text>
<text x="150" y="441" class="sub" text-anchor="middle">Lending liquidation</text>
<rect x="500" y="380" width="180" height="80" rx="10" fill="#ffffff" stroke="#cbd6e0" stroke-width="1.5"/>
<text x="590" y="428" class="node" text-anchor="middle">Wallet B</text>
<rect x="980" y="380" width="180" height="80" rx="10" fill="#f7f4fc" stroke="#d6c9e9" stroke-width="1.5"/>
<text x="1070" y="428" class="node" text-anchor="middle">Candidate 2</text>
