<title id="title">From Three Alpha Seeds to New Alpha</title><desc id="desc">Skill 1 finds two illustrative wallets from each of three Alpha seeds through six arrows. Skill 2 investigates all six wallets to form three candidate mechanisms. Skill 3 validates mechanisms and current conditions to produce reports and conditional new Alpha. Skill 4 coordinates the full workflow. Stages are numbered separately from Skills.</desc><defs>
