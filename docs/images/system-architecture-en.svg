<text x="566" y="550" class="body" text-anchor="start" style="fill:#24384d">Collateral redemption</text>
<rect x="508" y="596" width="324" height="54" rx="10" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<rect x="520" y="606" width="34" height="34" rx="8" fill="#eff5ff" stroke="none" stroke-width="1.3"/>
<text x="537" y="630" class="node" text-anchor="middle" style="fill:#2563b8">E</text>
<text x="566" y="629" class="body" text-anchor="start" style="fill:#24384d">Keeper actions</text>
<rect x="508" y="660" width="324" height="54" rx="10" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<rect x="520" y="670" width="34" height="34" rx="8" fill="#eff5ff" stroke="none" stroke-width="1.3"/>
<text x="537" y="694" class="node" text-anchor="middle" style="fill:#2563b8">F</text>
<text x="566" y="693" class="body" text-anchor="start" style="fill:#24384d">Auction purchases</text>
<rect x="1408" y="316" width="334" height="170" rx="12" fill="#ffffff" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1428" y="346" class="node" text-anchor="start">Mechanism</text>
<text x="1428" y="367" class="small" text-anchor="start">Does the evidence explain it?</text>
<text x="1428" y="395" class="node" text-anchor="start">Economics</text>
<text x="1428" y="416" class="small" text-anchor="start">Do rewards exceed costs?</text>
<text x="1428" y="444" class="node" text-anchor="start">Availability</text>
<text x="1428" y="465" class="small" text-anchor="start">Can it be executed now?</text>
<text x="1428" y="528" class="body" text-anchor="start" style="fill:#24384d">A report for every candidate</text>
<text x="1428" y="558" class="small" text-anchor="start">Actionable · Monitor</text>
<text x="1428" y="584" class="small" text-anchor="start">Rejected · Insufficient Evidence</text>
<rect x="1408" y="618" width="334" height="90" rx="12" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1428" y="652" class="node" text-anchor="start" style="fill:#20775b">New Alpha</text>
<text x="1428" y="682" class="small" text-anchor="start">Only if validation supports it</text>
<text x="40" y="801" class="label" text-anchor="start">THE FOUR SKILLS</text>
<rect x="40" y="820" width="406" height="203" rx="16" fill="#eff5ff" stroke="#c8daf8" stroke-width="1.3"/>
<text x="62" y="853" class="node" text-anchor="start" style="fill:#2563b8">Skill 1 · Find wallets</text>
<text x="62" y="893" class="body" text-anchor="start" style="fill:#344b60">We identify wallets that executed seed</text>
<text x="62" y="919" class="body" text-anchor="start" style="fill:#344b60">mechanisms and verify their roles</text>
<text x="62" y="945" class="body" text-anchor="start" style="fill:#344b60">using transaction receipts.</text>
<text x="62" y="1000" class="small" text-anchor="start">alpha-seed-wallets</text>
<rect x="478" y="820" width="406" height="203" rx="16" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<text x="500" y="853" class="node" text-anchor="start" style="fill:#7953ad">Skill 2 · Investigate wallets</text>
<text x="500" y="893" class="body" text-anchor="start" style="fill:#344b60">We trace each wallet’s history to</text>
<text x="500" y="919" class="body" text-anchor="start" style="fill:#344b60">uncover repeated actions and propose</text>
<text x="500" y="945" class="body" text-anchor="start" style="fill:#344b60">new mechanisms.</text>
<text x="500" y="1000" class="small" text-anchor="start">wallet-alpha-investigation</text>
<rect x="916" y="820" width="406" height="203" rx="16" fill="#fff7ed" stroke="#f1dcc2" stroke-width="1.3"/>
<text x="938" y="853" class="node" text-anchor="start" style="fill:#a8661e">Skill 3 · Validate candidates</text>
<text x="938" y="893" class="body" text-anchor="start" style="fill:#344b60">We test each candidate against</text>
<text x="938" y="919" class="body" text-anchor="start" style="fill:#344b60">transaction evidence, execution costs,</text>
<text x="938" y="945" class="body" text-anchor="start" style="fill:#344b60">and current protocol conditions.</text>
<text x="938" y="1000" class="small" text-anchor="start">protocol-alpha-validation</text>
<rect x="1354" y="820" width="406" height="203" rx="16" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1376" y="853" class="node" text-anchor="start" style="fill:#20775b">Skill 4 · Direct the research</text>
<text x="1376" y="893" class="body" text-anchor="start" style="fill:#344b60">We coordinate the three research steps,</text>
<text x="1376" y="919" class="body" text-anchor="start" style="fill:#344b60">preserve evidence, and select what</text>
<text x="1376" y="945" class="body" text-anchor="start" style="fill:#344b60">to investigate next.</text>
<text x="1376" y="1000" class="small" text-anchor="start">protocol-alpha-discovery</text>
<text x="40" y="1070" class="small" text-anchor="start">Method illustration · Two wallets per seed · USDD wallets and auction hypothesis are illustrative, not recorded findings.</text>
