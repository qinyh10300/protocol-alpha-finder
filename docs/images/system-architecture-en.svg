<text x="195" y="286" class="node" text-anchor="middle">Energy Rental</text>
<text x="195" y="314" class="small" text-anchor="middle">Clear depleted rental orders,</text>
<text x="195" y="337" class="small" text-anchor="middle">recover resources and rewards.</text>
<rect x="928" y="254" width="314" height="98" rx="6" fill="#ffffff" stroke="#d8cfe5" stroke-width="1.3"/>
<text x="1085" y="286" class="node" text-anchor="middle">Rental sequence</text>
<text x="1085" y="314" class="small" text-anchor="middle">Bundled calls may lower</text>
<text x="1085" y="337" class="small" text-anchor="middle">execution costs.</text>
<rect x="54" y="387" width="282" height="98" rx="6" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.3"/>
<text x="195" y="419" class="node" text-anchor="middle">JustLend</text>
<text x="195" y="447" class="small" text-anchor="middle">Repay undercollateralized loans</text>
<text x="195" y="470" class="small" text-anchor="middle">and receive seized collateral.</text>
<rect x="928" y="387" width="314" height="98" rx="6" fill="#ffffff" stroke="#d8cfe5" stroke-width="1.3"/>
<text x="1085" y="419" class="node" text-anchor="middle">Collateral recycling</text>
<text x="1085" y="447" class="small" text-anchor="middle">Redeem + swap may release</text>
<text x="1085" y="470" class="small" text-anchor="middle">capital sooner.</text>
