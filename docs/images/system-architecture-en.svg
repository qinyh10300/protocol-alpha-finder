<rect x="58" y="316" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="350" class="node" text-anchor="start">Energy Rental</text>
<text x="78" y="381" class="small" text-anchor="start">Clear depleted rental orders,</text>
<text x="78" y="404" class="small" text-anchor="start">recover resources and rewards.</text>
<rect x="958" y="316" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="350" class="node" text-anchor="start">Rental sequence</text>
<text x="978" y="381" class="small" text-anchor="start">Bundled calls may lower</text>
<text x="978" y="404" class="small" text-anchor="start">execution costs.</text>
<rect x="58" y="459" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="493" class="node" text-anchor="start">JustLend</text>
<text x="78" y="524" class="small" text-anchor="start">Repay undercollateralized loans</text>
<text x="78" y="547" class="small" text-anchor="start">and receive seized collateral.</text>
<rect x="958" y="459" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="493" class="node" text-anchor="start">Collateral recycling</text>
<text x="978" y="524" class="small" text-anchor="start">Redeem + swap may release</text>
<text x="978" y="547" class="small" text-anchor="start">capital sooner.</text>
<rect x="58" y="602" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="636" class="node" text-anchor="start">USDD</text>
<text x="78" y="667" class="small" text-anchor="start">Trigger liquidation, restart auctions,</text>
<text x="78" y="690" class="small" text-anchor="start">or purchase auction collateral.</text>
<rect x="958" y="602" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="636" class="node" text-anchor="start">Auction timing</text>
<text x="978" y="667" class="small" text-anchor="start">Temporary discounts may justify</text>
<text x="978" y="690" class="small" text-anchor="start">a closer look at execution costs.</text>
<rect x="508" y="310" width="324" height="54" rx="10" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
