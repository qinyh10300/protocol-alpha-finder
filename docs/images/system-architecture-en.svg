<text x="566" y="407" class="body" text-anchor="start" style="fill:#24384d">Resource bundling</text>
<rect x="508" y="453" width="324" height="54" rx="10" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<rect x="520" y="463" width="34" height="34" rx="8" fill="#eff5ff" stroke="none" stroke-width="1.3"/>
