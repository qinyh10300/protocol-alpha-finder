<text x="1320" y="590" class="sub" text-anchor="start">Bundled rental and liquidation</text>
<text x="1320" y="615" class="sub" text-anchor="start">may lower execution costs</text>
<text x="1320" y="640" class="sub" text-anchor="start">within one transaction.</text>
