<title id="title">From Seed Alpha to New Alpha</title>
<desc id="desc">Energy Rental, JustLend and USDD seed a four-Skill pipeline. Curved blue, purple and amber arrows connect seed mechanisms, selected wallet behaviors, candidate hypotheses and validation outcomes. A green orchestration Skill coordinates the research. The saved run has no promoted new seed; sources and evidence limits are described in the architecture document.</desc>
