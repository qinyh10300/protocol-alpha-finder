<text x="150" y="523" class="node" text-anchor="middle">USDD</text>
<text x="150" y="551" class="sub" text-anchor="middle">Keeper / auction</text>
<rect x="500" y="490" width="180" height="80" rx="10" fill="#ffffff" stroke="#cbd6e0" stroke-width="1.5"/>
<text x="590" y="538" class="node" text-anchor="middle">Wallet C</text>
<rect x="980" y="490" width="180" height="80" rx="10" fill="#f7f4fc" stroke="#d6c9e9" stroke-width="1.5"/>
