<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="650" viewBox="0 0 1740 650" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From Seed Alpha to New Alpha</title>
<desc id="desc">Three seeds—Energy Rental liquidation, JustLend lending liquidation and USDD keeper or auction actions—lead to strategy wallets through alpha-seed-wallets. wallet-alpha-investigation studies the wallets to form Alpha candidates. protocol-alpha-validation produces reports and, if a mechanism is established, new Alpha. protocol-alpha-discovery coordinates the entire flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#62778c" stroke-width="1.5"/></marker></defs>
<style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #253647; }
.heading { font-size: 32px; font-weight: 700; }
.section { font-size: 23px; font-weight: 600; }
.node { font-size: 23px; font-weight: 600; }
.sub { font-size: 19px; fill: #60748a; }
.skill { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 17px; fill: #38654c; }
.line { fill: none; stroke: #62778c; stroke-width: 1.6; }
.arrow { fill: none; stroke: #62778c; stroke-width: 1.6; marker-end: url(#arrow); }
.orchestrate { fill: none; stroke: #89a998; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
</style>
<rect width="1740" height="650" fill="#ffffff"/>
<text x="40" y="48" class="heading" text-anchor="start">From Seed Alpha to New Alpha</text>
<text x="870" y="105" class="skill" text-anchor="middle">protocol-alpha-discovery</text>
<text x="870" y="132" class="sub" text-anchor="middle">Coordinate discovery, investigation and validation</text>
<path d="M 150 179 V 153 H 1580 V 179" class="orchestrate"/>
<text x="150" y="222" class="section" text-anchor="middle">Three Alpha Seeds</text>
<text x="590" y="222" class="section" text-anchor="middle">Strategy Wallets</text>
<text x="1070" y="222" class="section" text-anchor="middle">Alpha Candidates</text>
<text x="1580" y="222" class="section" text-anchor="middle">Validation Results</text>
<rect x="40" y="270" width="220" height="80" rx="10" fill="#f1f5fb" stroke="#b2c5df" stroke-width="1.5"/>
<text x="150" y="303" class="node" text-anchor="middle">Energy Rental</text>
<text x="150" y="331" class="sub" text-anchor="middle">Liquidation</text>
<rect x="500" y="270" width="180" height="80" rx="10" fill="#ffffff" stroke="#cbd6e0" stroke-width="1.5"/>
<text x="590" y="318" class="node" text-anchor="middle">Wallet A</text>
<rect x="980" y="270" width="180" height="80" rx="10" fill="#f7f4fc" stroke="#d6c9e9" stroke-width="1.5"/>
<text x="1070" y="318" class="node" text-anchor="middle">Candidate 1</text>
<path d="M 260 310 H 280 M 680 310 H 690 M 1160 310 H 1170" class="line"/>
<path d="M 480 310 H 490" class="arrow"/>
<path d="M 970 310 H 980" class="arrow"/>
