<text x="1085" y="552" class="node" text-anchor="middle">Auction timing</text>
<text x="1085" y="580" class="small" text-anchor="middle">Temporary discounts may justify</text>
<text x="1085" y="603" class="small" text-anchor="middle">a closer look at execution costs.</text>
