<text x="80" y="590" class="sub" text-anchor="start">Liquidate depleted rental</text>
<text x="80" y="615" class="sub" text-anchor="start">orders to recover resources</text>
<text x="80" y="640" class="sub" text-anchor="start">and earn rewards.</text>
