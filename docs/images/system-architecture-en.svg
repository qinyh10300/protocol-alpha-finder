<text x="566" y="343" class="body" text-anchor="start" style="fill:#24384d">Rental liquidations</text>
<rect x="508" y="374" width="324" height="54" rx="10" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
