<text x="1320" y="950" class="sub" text-anchor="start">Auction resets may create</text>
<text x="1320" y="975" class="sub" text-anchor="start">temporary discounts worth testing</text>
<text x="1320" y="1000" class="sub" text-anchor="start">against execution costs.</text>
