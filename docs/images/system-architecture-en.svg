<text x="380" y="367" class="skill" text-anchor="middle">alpha-seed-wallets</text>
<text x="380" y="395" class="sub" text-anchor="middle">Find &amp; verify executors</text>
<path d="M 280 420 H 480" class="line"/>
<text x="830" y="367" class="skill" text-anchor="middle">wallet-alpha-investigation</text>
<text x="830" y="395" class="sub" text-anchor="middle">Study wallet histories</text>
<path d="M 690 420 H 970" class="line"/>
<text x="1320" y="367" class="skill" text-anchor="middle">protocol-alpha-validation</text>
<text x="1320" y="395" class="sub" text-anchor="middle">Validate mechanism &amp; conditions</text>
<path d="M 1170 420 H 1470" class="line"/>
<path d="M 1470 335 V 525" class="line"/>
<path d="M 1470 335 H 1480" class="arrow"/>
<path d="M 1470 525 H 1480" class="arrow"/>
<rect x="1490" y="287" width="220" height="96" rx="10" fill="#eaf4ee" stroke="#83a68e" stroke-width="1.5"/>
<text x="1600" y="326" class="node" text-anchor="middle">New Alpha</text>
<text x="1600" y="358" class="sub" text-anchor="middle">If validated</text>
<rect x="1490" y="477" width="220" height="96" rx="10" fill="#ffffff" stroke="#cbd6e0" stroke-width="1.5"/>
<text x="1600" y="516" class="node" text-anchor="middle">Alpha Reports</text>
<text x="1600" y="548" class="sub" text-anchor="middle">Evidence &amp; next checks</text>
<text x="870" y="627" class="sub" text-anchor="middle">Wallets and candidates are illustrative. Every candidate receives a report.</text>
