<text x="81" y="242" class="node" text-anchor="middle" style="fill:#ffffff">1</text>
<text x="116" y="243" class="heading" text-anchor="start">Read historical evidence</text>
<text x="64" y="307" class="node" text-anchor="start">Contract calls</text>
<text x="64" y="332" class="body" text-anchor="start">Which functions did the wallet execute?</text>
<text x="64" y="362" class="node" text-anchor="start">Receipts &amp; event logs</text>
<text x="64" y="387" class="body" text-anchor="start">Did those actions actually succeed?</text>
<text x="64" y="417" class="node" text-anchor="start">Token transfers &amp; fees</text>
<text x="64" y="442" class="body" text-anchor="start">What entered, left, and remained?</text>
<text x="64" y="472" class="node" text-anchor="start">Protocol state</text>
<text x="64" y="497" class="body" text-anchor="start">What conditions made the action possible?</text>
<path d="M 64 511 L 536 511" stroke="#e8eef4" fill="none"/>
<text x="64" y="537" class="label" text-anchor="start" style="fill:#2563b8">INPUT: ON-CHAIN HISTORY</text>
<rect x="640" y="195" width="520" height="360" rx="18" fill="#ffffff" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="640" y="195" width="520" height="78" rx="18" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="662" y="215" width="38" height="38" rx="19" fill="#7953ad" stroke="#7953ad" stroke-width="1.3"/>
<text x="681" y="242" class="node" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="716" y="243" class="heading" text-anchor="start">Find repeatable behavior</text>
<text x="664" y="307" class="node" text-anchor="start">Match known seed actions</text>
<text x="664" y="332" class="body" text-anchor="start">Link successful calls to their executors.</text>
<text x="664" y="378" class="node" text-anchor="start">Reconstruct the sequence</text>
<text x="664" y="403" class="body" text-anchor="start">Follow calls, asset movements, and costs.</text>
<text x="664" y="449" class="node" text-anchor="start">Compare repeated executions</text>
<text x="664" y="474" class="body" text-anchor="start">Separate recurring behavior from one-offs.</text>
<path d="M 664 511 L 1136 511" stroke="#e8eef4" fill="none"/>
<text x="664" y="537" class="label" text-anchor="start" style="fill:#7953ad">ANALYSIS: ACTIONS + ASSET FLOWS</text>
<rect x="1240" y="195" width="520" height="360" rx="18" fill="#ffffff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="1240" y="195" width="520" height="78" rx="18" fill="#eff5ff" stroke="#c8daf8" stroke-width="1.3"/>
<rect x="1262" y="215" width="38" height="38" rx="19" fill="#2563b8" stroke="#2563b8" stroke-width="1.3"/>
<text x="1281" y="242" class="node" text-anchor="middle" style="fill:#ffffff">3</text>
<text x="1316" y="243" class="heading" text-anchor="start">Identify strategy wallets</text>
<text x="1264" y="307" class="node" text-anchor="start">Keep the actual executor</text>
<text x="1264" y="332" class="body" text-anchor="start">Distinguish wallets from relayers and helpers.</text>
<text x="1264" y="378" class="node" text-anchor="start">Attach the evidence</text>
<text x="1264" y="403" class="body" text-anchor="start">Record the seed, calls, receipts, and role.</text>
<text x="1264" y="449" class="node" text-anchor="start">Build a research shortlist</text>
<text x="1264" y="474" class="body" text-anchor="start">Investigate each wallet beyond its seed.</text>
<path d="M 1264 511 L 1736 511" stroke="#e8eef4" fill="none"/>
<text x="1264" y="537" class="label" text-anchor="start" style="fill:#2563b8">OUTPUT: EVIDENCE-BACKED WALLETS</text>
<rect x="1240" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="1240" y="635" width="520" height="78" rx="18" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<rect x="1262" y="655" width="38" height="38" rx="19" fill="#7953ad" stroke="#7953ad" stroke-width="1.3"/>
<text x="1281" y="682" class="node" text-anchor="middle" style="fill:#ffffff">4</text>
<text x="1316" y="683" class="heading" text-anchor="start">Observe fresh activity</text>
<text x="1264" y="747" class="node" text-anchor="start">Read new transactions</text>
<text x="1264" y="772" class="body" text-anchor="start">Look for new contracts and call sequences.</text>
<text x="1264" y="818" class="node" text-anchor="start">Compare with wallet history</text>
<text x="1264" y="843" class="body" text-anchor="start">Find changed behavior and repeated actions.</text>
<text x="1264" y="889" class="node" text-anchor="start">Recheck protocol conditions</text>
<text x="1264" y="914" class="body" text-anchor="start">See whether earlier opportunities reappear.</text>
<path d="M 1264 951 L 1736 951" stroke="#e8eef4" fill="none"/>
<text x="1264" y="977" class="label" text-anchor="start" style="fill:#7953ad">MONITORING: NEW ACTIVITY + STATE</text>
<rect x="640" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#f1dcc2" stroke-width="1.3"/>
<rect x="640" y="635" width="520" height="78" rx="18" fill="#fff7ed" stroke="#f1dcc2" stroke-width="1.3"/>
<rect x="662" y="655" width="38" height="38" rx="19" fill="#a8661e" stroke="#a8661e" stroke-width="1.3"/>
<text x="681" y="682" class="node" text-anchor="middle" style="fill:#ffffff">5</text>
<text x="716" y="683" class="heading" text-anchor="start">Form a new Alpha candidate</text>
<text x="664" y="747" class="node" text-anchor="start">Describe the possible mechanism</text>
<text x="664" y="772" class="body" text-anchor="start">Explain how the observed actions earn value.</text>
<text x="664" y="818" class="node" text-anchor="start">Attach supporting executions</text>
<text x="664" y="843" class="body" text-anchor="start">Keep transaction evidence and cost estimates.</text>
<text x="664" y="889" class="node" text-anchor="start">Write a checkable hypothesis</text>
<text x="664" y="914" class="body" text-anchor="start">State what would confirm or disprove it.</text>
<path d="M 664 951 L 1136 951" stroke="#e8eef4" fill="none"/>
<text x="664" y="977" class="label" text-anchor="start" style="fill:#a8661e">OUTPUT: HYPOTHESIS + EVIDENCE</text>
<rect x="40" y="635" width="520" height="360" rx="18" fill="#ffffff" stroke="#c9e5d9" stroke-width="1.3"/>
<rect x="40" y="635" width="520" height="78" rx="18" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<rect x="62" y="655" width="38" height="38" rx="19" fill="#20775b" stroke="#20775b" stroke-width="1.3"/>
<text x="81" y="682" class="node" text-anchor="middle" style="fill:#ffffff">6</text>
<text x="116" y="683" class="heading" text-anchor="start">Validate and learn</text>
<text x="64" y="747" class="node" text-anchor="start">Test evidence, costs, and current state</text>
<text x="64" y="772" class="body" text-anchor="start">Separate an observed pattern from an edge.</text>
<text x="64" y="818" class="node" text-anchor="start">Produce a report for every candidate</text>
<text x="64" y="843" class="body" text-anchor="start">Evidence, outcome, and the next checks to run.</text>
<text x="64" y="889" class="node" text-anchor="start">Expand only after validation</text>
<text x="64" y="914" class="body" text-anchor="start">An established mechanism can become a seed.</text>
<path d="M 64 951 L 536 951" stroke="#e8eef4" fill="none"/>
<text x="64" y="977" class="label" text-anchor="start" style="fill:#20775b">OUTPUT: REPORT + NEXT CHECKS</text>
<path data-kind="validated-seed-loop" d="M 300 633 C 300 598.0 300 598.0 300 563" stroke="#20775b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a3)" stroke-dasharray="5 6"/>
<text x="340" y="597" class="small" text-anchor="start" style="fill:#20775b">Use an established mechanism as a new seed; repeat with fresh evidence.</text>
<text x="40" y="1090" class="small" text-anchor="start">Monitoring describes repeated collection and review. The current workflow runs these checks manually.</text>
