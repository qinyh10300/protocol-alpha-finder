<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1110" viewBox="0 0 2080 1110" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Database &amp; Research Data</title><desc id="desc">The implemented collector stores items, coverage and checkpoints in SQLite and keeps raw evidence in files. Skills produce JSON wallet, candidate, validation and run records. The adapter checks their consistency and projects snapshots and Alpha reports for the frontend. These research entities are JSON records, not SQL tables.</desc><defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#6088c5"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#9774b9"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#bd934f"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#58826b"/></marker>
</defs><style>
