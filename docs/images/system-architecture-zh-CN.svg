<text x="300" y="757" class="heading" text-anchor="middle" style="fill:#2563b8">Skill 1 · 发现并核验钱包</text>
<text x="300" y="792" class="body" text-anchor="middle">我们从已知机制的执行记录中找到钱包，</text>
<text x="300" y="819" class="body" text-anchor="middle">再通过交易回执核验其真实执行角色。</text>
<text x="300" y="851" class="small" text-anchor="middle" style="fill:#2563b8">alpha-seed-wallets</text>
<rect x="640" y="724" width="520" height="150" rx="8" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<text x="900" y="757" class="heading" text-anchor="middle" style="fill:#7953ad">Skill 2 · 研究钱包历史</text>
<text x="900" y="792" class="body" text-anchor="middle">我们追踪每个钱包的完整历史，</text>
<text x="900" y="819" class="body" text-anchor="middle">从重复操作中提出新的机制假设。</text>
<text x="900" y="851" class="small" text-anchor="middle" style="fill:#7953ad">wallet-alpha-investigation</text>
<rect x="1240" y="724" width="520" height="150" rx="8" fill="#fff7ed" stroke="#f1dcc2" stroke-width="1.3"/>
<text x="1500" y="757" class="heading" text-anchor="middle" style="fill:#a8661e">Skill 3 · 验证候选</text>
<text x="1500" y="792" class="body" text-anchor="middle">我们结合交易证据、执行成本与</text>
<text x="1500" y="819" class="body" text-anchor="middle">协议当前条件，逐个检验候选机制。</text>
<text x="1500" y="851" class="small" text-anchor="middle" style="fill:#a8661e">protocol-alpha-validation</text>
