.action { font-size: 19px; font-weight: 600; }
.number { font-size: 17px; font-weight: 700; fill: #748a9e; }
.caption { font-size: 17px; fill: #7c8d9e; }
</style><rect width="2280" height="1140" fill="#ffffff"/>
<text x="40" y="54" class="heading" text-anchor="start">从三个 Alpha Seed 发现新的 Alpha</text>
<path data-kind="orchestration" d="M 1140 197 C 1140 238 500 220 500 266" fill="none" stroke="#4d8064" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.5" marker-end="url(#arrow-3)"/>
<path data-kind="orchestration" d="M 1140 197 C 1140 238 1120 220 1120 266" fill="none" stroke="#4d8064" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.5" marker-end="url(#arrow-3)"/>
<path data-kind="orchestration" d="M 1140 197 C 1140 238 1770 220 1770 266" fill="none" stroke="#4d8064" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.5" marker-end="url(#arrow-3)"/>
<rect x="40" y="360" width="300" height="710" rx="18" fill="#fbfcfe" stroke="#dce5ef" stroke-width="1.3"/>
<text x="64" y="403" class="number" text-anchor="start">01</text>
<text x="102" y="403" class="section" text-anchor="start">Alpha Seed</text>
<text x="64" y="439" class="sub" text-anchor="start">从三个已知协议机制出发，</text>
<text x="64" y="463" class="sub" text-anchor="start">寻找真实执行过它们的钱包。</text>
<path d="M 64 506 H 316" stroke="#e5ebf2"/>
<rect x="660" y="360" width="300" height="710" rx="18" fill="#fbfcfe" stroke="#dce5ef" stroke-width="1.3"/>
<text x="684" y="403" class="number" text-anchor="start">02</text>
<text x="722" y="403" class="section" text-anchor="start">策略钱包</text>
<text x="684" y="439" class="sub" text-anchor="start">以已核验的执行行为为依据，</text>
<text x="684" y="463" class="sub" text-anchor="start">筛选值得进一步研究的钱包。</text>
<path d="M 684 506 H 936" stroke="#e5ebf2"/>
<rect x="1280" y="360" width="340" height="710" rx="18" fill="#fbfcfe" stroke="#dce5ef" stroke-width="1.3"/>
<text x="1304" y="403" class="number" text-anchor="start">03</text>
<text x="1342" y="403" class="section" text-anchor="start">Alpha 候选</text>
<text x="1304" y="439" class="sub" text-anchor="start">从重复的钱包行为形成假设，</text>
<text x="1304" y="463" class="sub" text-anchor="start">再用交易证据逐项检验。</text>
<path d="M 1304 506 H 1596" stroke="#e5ebf2"/>
<rect x="1920" y="360" width="320" height="710" rx="18" fill="#fbfcfe" stroke="#dce5ef" stroke-width="1.3"/>
<text x="1944" y="403" class="number" text-anchor="start">04</text>
<text x="1982" y="403" class="section" text-anchor="start">Validation · 验证结果</text>
<text x="1944" y="439" class="sub" text-anchor="start">核验机制与当前执行条件，</text>
<text x="1944" y="463" class="sub" text-anchor="start">再判断能否形成新的 Alpha。</text>
<path d="M 1944 506 H 2216" stroke="#e5ebf2"/>
<path data-kind="seed-wallet" d="M 320 595 C 491.84000000000003 595 506.15999999999997 550 678 550" fill="none" stroke="#5c88cc" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-0)"/>
<path data-kind="seed-wallet" d="M 320 595 C 491.84000000000003 595 506.15999999999997 640 678 640" fill="none" stroke="#5c88cc" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-0)"/>
<path data-kind="seed-wallet" d="M 320 775 C 491.84000000000003 775 506.15999999999997 730 678 730" fill="none" stroke="#5c88cc" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-0)"/>
<path data-kind="seed-wallet" d="M 320 775 C 491.84000000000003 775 506.15999999999997 820 678 820" fill="none" stroke="#5c88cc" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-0)"/>
