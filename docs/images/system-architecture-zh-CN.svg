<path data-kind="wallet-candidate" d="M 940 640 C 1111.84 640 1126.16 595 1298 595" fill="none" stroke="#9671be" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-1)"/>
<path data-kind="wallet-candidate" d="M 940 730 C 1111.84 730 1126.16 775 1298 775" fill="none" stroke="#9671be" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-1)"/>
<path data-kind="wallet-candidate" d="M 940 820 C 1111.84 820 1126.16 775 1298 775" fill="none" stroke="#9671be" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-1)"/>
<path data-kind="wallet-candidate" d="M 940 910 C 1111.84 910 1126.16 955 1298 955" fill="none" stroke="#9671be" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-1)"/>
<path data-kind="wallet-candidate" d="M 940 1000 C 1111.84 1000 1126.16 955 1298 955" fill="none" stroke="#9671be" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-1)"/>
<path data-kind="candidate-validation" d="M 1600 595 C 1748.8 595 1761.2 775 1910 775" fill="none" stroke="#c19349" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-2)"/>
<path data-kind="candidate-validation" d="M 1600 775 C 1748.8 775 1761.2 775 1910 775" fill="none" stroke="#c19349" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-2)"/>
<path data-kind="candidate-validation" d="M 1600 955 C 1748.8 955 1761.2 775 1910 775" fill="none" stroke="#c19349" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-2)"/>
<rect x="60" y="522" width="260" height="146" rx="13" fill="#f5f9ff" stroke="#d7e5f7" stroke-width="1.3"/>
<text x="80" y="559" class="node" text-anchor="start">Energy Rental</text>
<text x="80" y="590" class="sub" text-anchor="start">清算保证金不足的订单，</text>
<text x="80" y="615" class="sub" text-anchor="start">回收资源，</text>
<text x="80" y="640" class="sub" text-anchor="start">并获得协议奖励。</text>
<rect x="1300" y="522" width="300" height="146" rx="13" fill="#faf7ff" stroke="#e2d9f0" stroke-width="1.3"/>
<text x="1320" y="559" class="node" text-anchor="start">租赁组合操作</text>
<text x="1320" y="590" class="sub" text-anchor="start">在同一交易中组合租赁与清算，</text>
<text x="1320" y="615" class="sub" text-anchor="start">可能降低</text>
<text x="1320" y="640" class="sub" text-anchor="start">整体执行成本。</text>
<rect x="60" y="702" width="260" height="146" rx="13" fill="#f5f9ff" stroke="#d7e5f7" stroke-width="1.3"/>
<text x="80" y="739" class="node" text-anchor="start">JustLend</text>
<text x="80" y="770" class="sub" text-anchor="start">偿还抵押不足头寸的债务，</text>
<text x="80" y="795" class="sub" text-anchor="start">通过协议清算，</text>
<text x="80" y="820" class="sub" text-anchor="start">获得被清算的抵押品。</text>
<rect x="1300" y="702" width="300" height="146" rx="13" fill="#faf7ff" stroke="#e2d9f0" stroke-width="1.3"/>
<text x="1320" y="739" class="node" text-anchor="start">抵押品回收</text>
<text x="1320" y="770" class="sub" text-anchor="start">清算后赎回并兑换抵押品，</text>
<text x="1320" y="795" class="sub" text-anchor="start">可能更快地</text>
<text x="1320" y="820" class="sub" text-anchor="start">回收占用资金。</text>
<rect x="60" y="882" width="260" height="146" rx="13" fill="#f5f9ff" stroke="#d7e5f7" stroke-width="1.3"/>
<text x="80" y="919" class="node" text-anchor="start">USDD</text>
<text x="80" y="950" class="sub" text-anchor="start">触发清算、重启拍卖，</text>
<text x="80" y="975" class="sub" text-anchor="start">或通过 keeper 操作</text>
<text x="80" y="1000" class="sub" text-anchor="start">购买抵押品。</text>
<rect x="1300" y="882" width="300" height="146" rx="13" fill="#faf7ff" stroke="#e2d9f0" stroke-width="1.3"/>
<text x="1320" y="919" class="node" text-anchor="start">拍卖时机</text>
<text x="1320" y="950" class="sub" text-anchor="start">拍卖重启可能出现短暂折价，</text>
<text x="1320" y="975" class="sub" text-anchor="start">需要结合执行成本</text>
<text x="1320" y="1000" class="sub" text-anchor="start">验证是否成立。</text>
<rect x="680" y="516" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="546" class="node" text-anchor="start">钱包 A</text>
<text x="700" y="571" class="sub" text-anchor="start">租赁清算</text>
<rect x="680" y="606" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="636" class="node" text-anchor="start">钱包 B</text>
<text x="700" y="661" class="sub" text-anchor="start">资源组合操作</text>
<rect x="680" y="696" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="726" class="node" text-anchor="start">钱包 C</text>
<text x="700" y="751" class="sub" text-anchor="start">借贷清算</text>
<rect x="680" y="786" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="816" class="node" text-anchor="start">钱包 D</text>
<text x="700" y="841" class="sub" text-anchor="start">抵押品赎回</text>
<rect x="680" y="876" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="906" class="node" text-anchor="start">钱包 E</text>
<text x="700" y="931" class="sub" text-anchor="start">Keeper 操作</text>
<rect x="680" y="966" width="260" height="68" rx="12" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="700" y="996" class="node" text-anchor="start">钱包 F</text>
<text x="700" y="1021" class="sub" text-anchor="start">拍卖购买</text>
<rect x="360.0" y="268" width="280" height="86" rx="14" fill="#edf4ff" stroke="#b7cff5" stroke-width="1.3"/>
<text x="500" y="295" class="action" text-anchor="middle" style="fill:#5c88cc">Skill 1 · 发现并核验钱包</text>
<text x="500" y="327" class="skill" text-anchor="middle" style="fill:#5c88cc">alpha-seed-wallets</text>
<rect x="980.0" y="268" width="280" height="86" rx="14" fill="#f4effc" stroke="#d3c2ee" stroke-width="1.3"/>
<text x="1120" y="295" class="action" text-anchor="middle" style="fill:#9671be">Skill 2 · 研究钱包历史</text>
<text x="1120" y="327" class="skill" text-anchor="middle" style="fill:#9671be">wallet-alpha-investigation</text>
<rect x="1640.0" y="268" width="260" height="86" rx="14" fill="#fff5e5" stroke="#ecd1a2" stroke-width="1.3"/>
<text x="1770" y="295" class="action" text-anchor="middle" style="fill:#c19349">Skill 3 · 验证候选</text>
<text x="1770" y="327" class="skill" text-anchor="middle" style="fill:#c19349">protocol-alpha-validation</text>
<rect x="850" y="108" width="580" height="88" rx="16" fill="#edf6f0" stroke="#bad8c6" stroke-width="1.3"/>
<text x="1140" y="141" class="action" text-anchor="middle" style="fill:#4d8064">Skill 4 · 协调整条研究流程</text>
<text x="1140" y="172" class="skill" text-anchor="middle" style="fill:#4d8064">protocol-alpha-discovery</text>
<text x="2080" y="547" class="sub" text-anchor="middle">机制 · 当前状态 · 成本</text>
<rect x="1944" y="600" width="272" height="130" rx="14" fill="#edf6f0" stroke="#cce2d5" stroke-width="1.3"/>
<text x="1968" y="650" class="node" text-anchor="start" style="fill:#4d8064">新的 Alpha</text>
<text x="1968" y="686" class="sub" text-anchor="start">验证支持后产出</text>
<rect x="1944" y="840" width="272" height="155" rx="14" fill="#ffffff" stroke="#e0e7ef" stroke-width="1.3"/>
<text x="1968" y="885" class="node" text-anchor="start">Alpha 报告</text>
<text x="1968" y="921" class="sub" text-anchor="start">证据与后续检查</text>
<text x="1968" y="956" class="sub" text-anchor="start">每个候选均有报告</text>
<text x="1140" y="1114" class="caption" text-anchor="middle">方法示意：每个 Seed 展开两个钱包。USDD 钱包与拍卖候选是流程示例，不是本次留档发现。</text>
</svg>
