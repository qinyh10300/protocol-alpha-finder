<rect x="54" y="254" width="282" height="98" rx="6" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.3"/>
<text x="195" y="286" class="node" text-anchor="middle">Energy Rental</text>
<text x="195" y="314" class="small" text-anchor="middle">清算保证金不足的租赁订单，</text>
<text x="195" y="337" class="small" text-anchor="middle">回收资源并获得奖励。</text>
<rect x="928" y="254" width="314" height="98" rx="6" fill="#ffffff" stroke="#d8cfe5" stroke-width="1.3"/>
<text x="1085" y="286" class="node" text-anchor="middle">租赁组合操作</text>
<text x="1085" y="314" class="small" text-anchor="middle">合并调用可能降低</text>
<text x="1085" y="337" class="small" text-anchor="middle">整体执行成本。</text>
<rect x="54" y="387" width="282" height="98" rx="6" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.3"/>
<text x="195" y="419" class="node" text-anchor="middle">JustLend</text>
<text x="195" y="447" class="small" text-anchor="middle">偿还抵押不足头寸的债务，</text>
<text x="195" y="470" class="small" text-anchor="middle">获得被清算的抵押品。</text>
<rect x="928" y="387" width="314" height="98" rx="6" fill="#ffffff" stroke="#d8cfe5" stroke-width="1.3"/>
<text x="1085" y="419" class="node" text-anchor="middle">抵押品回收</text>
<text x="1085" y="447" class="small" text-anchor="middle">赎回并兑换可能更快</text>
<text x="1085" y="470" class="small" text-anchor="middle">释放占用资金。</text>
<rect x="54" y="520" width="282" height="98" rx="6" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.3"/>
<text x="195" y="552" class="node" text-anchor="middle">USDD</text>
<text x="195" y="580" class="small" text-anchor="middle">触发清算、重启拍卖，</text>
<text x="195" y="603" class="small" text-anchor="middle">或购买拍卖中的抵押品。</text>
<rect x="928" y="520" width="314" height="98" rx="6" fill="#ffffff" stroke="#d8cfe5" stroke-width="1.3"/>
<text x="1085" y="552" class="node" text-anchor="middle">拍卖时机</text>
<text x="1085" y="580" class="small" text-anchor="middle">短暂折价可能带来机会，</text>
<text x="1085" y="603" class="small" text-anchor="middle">需要结合执行成本验证。</text>
