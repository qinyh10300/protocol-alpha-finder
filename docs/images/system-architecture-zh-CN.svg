<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1140" viewBox="0 0 2280 1140" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">从三个 Alpha Seed 发现新的 Alpha</title><desc id="desc">Skill 1 通过六条箭头从三个 Alpha Seed 各找到两个示意钱包，Skill 2 研究六个钱包形成三类候选机制，Skill 3 核验机制与当前条件并输出报告及有条件的新 Alpha，Skill 4 协调全流程。阶段编号与 Skill 编号分别标注。</desc><defs>
<marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#5c88cc"/></marker>
<marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#9671be"/></marker>
<marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#c19349"/></marker>
<marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#4d8064"/></marker>
</defs><style>
