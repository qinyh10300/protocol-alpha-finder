<rect x="40" y="249" width="280" height="122" rx="16" fill="#f7faff" stroke="#dce6f4" stroke-width="1.3"/>
<text x="60" y="288" class="node" text-anchor="start">Energy Rental</text>
<text x="60" y="321" class="small" text-anchor="start">清算保证金不足的租赁订单，</text>
<text x="60" y="346" class="small" text-anchor="start">回收资源并获得奖励。</text>
<rect x="1110" y="249" width="330" height="122" rx="16" fill="#fcfaff" stroke="#e4dcef" stroke-width="1.3"/>
<text x="1130" y="288" class="node" text-anchor="start">租赁组合操作</text>
<text x="1130" y="321" class="body" text-anchor="start">合并调用可能降低</text>
<text x="1130" y="346" class="body" text-anchor="start">整体执行成本。</text>
<rect x="40" y="409" width="280" height="122" rx="16" fill="#f7faff" stroke="#dce6f4" stroke-width="1.3"/>
<text x="60" y="448" class="node" text-anchor="start">JustLend</text>
<text x="60" y="481" class="small" text-anchor="start">偿还抵押不足头寸的债务，</text>
<text x="60" y="506" class="small" text-anchor="start">获得被清算的抵押品。</text>
<rect x="1110" y="409" width="330" height="122" rx="16" fill="#fcfaff" stroke="#e4dcef" stroke-width="1.3"/>
<text x="1130" y="448" class="node" text-anchor="start">抵押品回收</text>
<text x="1130" y="481" class="body" text-anchor="start">赎回并兑换可能更快</text>
<text x="1130" y="506" class="body" text-anchor="start">释放占用资金。</text>
<rect x="40" y="569" width="280" height="122" rx="16" fill="#f7faff" stroke="#dce6f4" stroke-width="1.3"/>
<text x="60" y="608" class="node" text-anchor="start">USDD</text>
<text x="60" y="641" class="small" text-anchor="start">触发清算、重启拍卖，</text>
<text x="60" y="666" class="small" text-anchor="start">或购买拍卖中的抵押品。</text>
<rect x="1110" y="569" width="330" height="122" rx="16" fill="#fcfaff" stroke="#e4dcef" stroke-width="1.3"/>
<text x="1130" y="608" class="node" text-anchor="start">拍卖时机</text>
<text x="1130" y="641" class="body" text-anchor="start">短暂折价可能带来机会，</text>
<text x="1130" y="666" class="body" text-anchor="start">需要结合执行成本验证。</text>
