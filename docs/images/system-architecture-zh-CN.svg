<text x="566" y="693" class="body" text-anchor="start" style="fill:#24384d">拍卖购买</text>
<rect x="1408" y="316" width="334" height="170" rx="12" fill="#ffffff" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1428" y="346" class="node" text-anchor="start">机制</text>
<text x="1428" y="367" class="small" text-anchor="start">证据是否支持这个机制？</text>
<text x="1428" y="395" class="node" text-anchor="start">收益</text>
<text x="1428" y="416" class="small" text-anchor="start">奖励能否覆盖成本？</text>
<text x="1428" y="444" class="node" text-anchor="start">可用性</text>
<text x="1428" y="465" class="small" text-anchor="start">当前条件是否允许执行？</text>
<text x="1428" y="528" class="body" text-anchor="start" style="fill:#24384d">每个候选都有一份报告</text>
<text x="1428" y="558" class="small" text-anchor="start">可执行 · 持续观察</text>
<text x="1428" y="584" class="small" text-anchor="start">已排除 · 证据不足</text>
<rect x="1408" y="618" width="334" height="90" rx="12" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1428" y="652" class="node" text-anchor="start" style="fill:#20775b">新的 Alpha</text>
<text x="1428" y="682" class="small" text-anchor="start">验证支持后产出</text>
<text x="40" y="801" class="label" text-anchor="start">四个 SKILL 的具体工作</text>
<rect x="40" y="820" width="406" height="203" rx="16" fill="#eff5ff" stroke="#c8daf8" stroke-width="1.3"/>
<text x="62" y="853" class="node" text-anchor="start" style="fill:#2563b8">Skill 1 · 发现并核验钱包</text>
<text x="62" y="893" class="body" text-anchor="start" style="fill:#344b60">我们从已知机制的执行记录中找到钱包，</text>
<text x="62" y="919" class="body" text-anchor="start" style="fill:#344b60">再通过交易回执核验其真实执行角色。</text>
<text x="62" y="1000" class="small" text-anchor="start">alpha-seed-wallets</text>
<rect x="478" y="820" width="406" height="203" rx="16" fill="#f5f1fc" stroke="#ded2f2" stroke-width="1.3"/>
<text x="500" y="853" class="node" text-anchor="start" style="fill:#7953ad">Skill 2 · 研究钱包历史</text>
<text x="500" y="893" class="body" text-anchor="start" style="fill:#344b60">我们追踪每个钱包的完整历史，</text>
<text x="500" y="919" class="body" text-anchor="start" style="fill:#344b60">从重复操作中提出新的机制假设。</text>
<text x="500" y="1000" class="small" text-anchor="start">wallet-alpha-investigation</text>
<rect x="916" y="820" width="406" height="203" rx="16" fill="#fff7ed" stroke="#f1dcc2" stroke-width="1.3"/>
<text x="938" y="853" class="node" text-anchor="start" style="fill:#a8661e">Skill 3 · 验证候选</text>
<text x="938" y="893" class="body" text-anchor="start" style="fill:#344b60">我们结合交易证据、执行成本与</text>
<text x="938" y="919" class="body" text-anchor="start" style="fill:#344b60">协议当前条件，逐个检验候选机制。</text>
<text x="938" y="1000" class="small" text-anchor="start">protocol-alpha-validation</text>
<rect x="1354" y="820" width="406" height="203" rx="16" fill="#eef8f4" stroke="#c9e5d9" stroke-width="1.3"/>
<text x="1376" y="853" class="node" text-anchor="start" style="fill:#20775b">Skill 4 · 协调 Skill 1–3</text>
<text x="1376" y="893" class="body" text-anchor="start" style="fill:#344b60">我们协调三个研究步骤、保留证据，</text>
<text x="1376" y="919" class="body" text-anchor="start" style="fill:#344b60">并确定下一轮需要研究的对象。</text>
<text x="1376" y="1000" class="small" text-anchor="start">protocol-alpha-discovery</text>
<text x="40" y="1070" class="small" text-anchor="start">方法示意 · 每个 Seed 展开两个钱包 · USDD 钱包与拍卖假设属于示例，不是本次留档发现。</text>
