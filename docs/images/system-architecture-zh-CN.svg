<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="830" viewBox="0 0 1960 830" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">从 Seed Alpha 发现新的 Alpha</title>
<desc id="desc">Energy Rental、JustLend 与 USDD 构成三个研究入口。蓝、紫、橙色曲线及 Skill 标签连接入口机制、钱包行为、候选假设与验证结果，绿色编排 Skill 协调整条流程。留档中尚无候选被提升为新 Seed，样本来源和证据限制见架构文档。</desc>
<defs>
<marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#4d8064"/></marker>
