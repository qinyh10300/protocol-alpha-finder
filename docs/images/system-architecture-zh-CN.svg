<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="650" viewBox="0 0 1740 650" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">从 Seed Alpha 发现新的 Alpha</title>
<desc id="desc">从 Energy Rental 清算、JustLend 借贷清算与 USDD keeper／拍卖三个入口，经 alpha-seed-wallets 发现策略钱包，再由 wallet-alpha-investigation 研究钱包历史形成 Alpha 候选。protocol-alpha-validation 验证候选并输出报告，机制得到验证后形成新的 Alpha。protocol-alpha-discovery 协调全流程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#62778c" stroke-width="1.5"/></marker></defs>
<style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #253647; }
.heading { font-size: 32px; font-weight: 700; }
.section { font-size: 23px; font-weight: 600; }
.node { font-size: 23px; font-weight: 600; }
.sub { font-size: 19px; fill: #60748a; }
.skill { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 17px; fill: #38654c; }
.line { fill: none; stroke: #62778c; stroke-width: 1.6; }
.arrow { fill: none; stroke: #62778c; stroke-width: 1.6; marker-end: url(#arrow); }
.orchestrate { fill: none; stroke: #89a998; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
</style>
<rect width="1740" height="650" fill="#ffffff"/>
<text x="40" y="48" class="heading" text-anchor="start">从 Seed Alpha 发现新的 Alpha</text>
<text x="870" y="105" class="skill" text-anchor="middle">protocol-alpha-discovery</text>
<text x="870" y="132" class="sub" text-anchor="middle">协调钱包发现、历史研究与候选验证</text>
<path d="M 150 179 V 153 H 1580 V 179" class="orchestrate"/>
<text x="150" y="222" class="section" text-anchor="middle">三个 Alpha Seed</text>
<text x="590" y="222" class="section" text-anchor="middle">Strategy Wallets · 策略钱包</text>
