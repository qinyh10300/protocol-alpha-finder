<rect x="58" y="316" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="350" class="node" text-anchor="start">Energy Rental</text>
<text x="78" y="381" class="small" text-anchor="start">清算保证金不足的租赁订单，</text>
<text x="78" y="404" class="small" text-anchor="start">回收资源并获得奖励。</text>
<rect x="958" y="316" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="350" class="node" text-anchor="start">租赁组合操作</text>
<text x="978" y="381" class="small" text-anchor="start">合并调用可能降低</text>
<text x="978" y="404" class="small" text-anchor="start">整体执行成本。</text>
<rect x="58" y="459" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="493" class="node" text-anchor="start">JustLend</text>
<text x="78" y="524" class="small" text-anchor="start">偿还抵押不足头寸的债务，</text>
<text x="78" y="547" class="small" text-anchor="start">获得被清算的抵押品。</text>
<rect x="958" y="459" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="493" class="node" text-anchor="start">抵押品回收</text>
<text x="978" y="524" class="small" text-anchor="start">赎回并兑换可能更快</text>
<text x="978" y="547" class="small" text-anchor="start">释放占用资金。</text>
<rect x="58" y="602" width="324" height="106" rx="12" fill="#ffffff" stroke="#dce5ef" stroke-width="1.3"/>
<text x="78" y="636" class="node" text-anchor="start">USDD</text>
<text x="78" y="667" class="small" text-anchor="start">触发清算、重启拍卖，</text>
<text x="78" y="690" class="small" text-anchor="start">或购买拍卖中的抵押品。</text>
<rect x="958" y="602" width="324" height="106" rx="12" fill="#ffffff" stroke="#ded4ed" stroke-width="1.3"/>
<text x="978" y="636" class="node" text-anchor="start">拍卖时机</text>
<text x="978" y="667" class="small" text-anchor="start">短暂折价可能带来机会，</text>
<text x="978" y="690" class="small" text-anchor="start">需要结合执行成本验证。</text>
